<script>
  const phrases = [
    "PhD student in Mathematics",
    "Université de Pau et des Pays de l'Adour"
  ];

  const el = document.getElementById('typed');

  // Respecte les utilisateurs qui ont désactivé les animations
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    let p = 0;                        // index de la phrase courante
    let i = phrases[0].length;        // nombre de lettres affichées
    let deleting = true;              // on part du texte déjà affiché : il s'efface d'abord

    function tick() {
      const full = phrases[p];
      i += deleting ? -1 : 1;
      el.textContent = full.slice(0, i);

      let delay = deleting ? 40 : 80; // vitesse d'effacement / d'écriture (ms)

      if (!deleting && i === full.length) {
        delay = 2000;                 // pause quand la phrase est complète
        deleting = true;
      } else if (deleting && i === 0) {
        deleting = false;
        p = (p + 1) % phrases.length; // phrase suivante
        delay = 400;                  // petite pause avant de réécrire
      }
      setTimeout(tick, delay);
    }

    setTimeout(tick, 2000);           // laisse le titre visible 2 s au chargement
  }
</script>
